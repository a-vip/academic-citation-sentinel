name: Academic Citation & Scholarly Impact Sentinel

on:
  schedule:
    # Run every Friday at 04:00 UTC for weekly academic impact digest
    - cron: '0 4 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  citation-monitor:
    name: Track Citations & Dispatch Scholarly Digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Execute Citation Sentinel
        env:
          TARGET_EMAIL: "workwithavip@gmail.com"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/citation_monitor.py

      - name: Commit Updated Citations and Reports
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CITATIONS.md reports/
          git diff --staged --quiet || (git commit -m "chore(citations): update academic citations & scholarly archive" && git push)
